name: Deploy API (SIT)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api-sit
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  NAME: deday-pool-villa-sit
  SERVICE: deday-pool-villa-sit-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sit
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    env:
      IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/deday-pool-villa-sit/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet and build
        run: go vet ./... && go build ./...

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ env.NAME }}-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrations are additive-only, so running them before the new revision is safe.
      - name: Run migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret="${NAME}-database-url")"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          go run ./cmd/migrate

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "${NAME}-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 2 \
            --cpu 1 --memory 256Mi \
            --labels app=deday-pool-villa,env=sit \
            --set-env-vars "^|^GIN_MODE=release|LINE_AUTH_BYPASS=false|LINE_LIFF_ID=${{ vars.LINE_LIFF_ID }}|CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --set-secrets "DATABASE_URL=${NAME}-database-url:latest,ADMIN_JWT_SECRET=${NAME}-admin-jwt-secret:latest,LINE_CHANNEL_ACCESS_TOKEN=${NAME}-line-channel-access-token:latest,LINE_CHANNEL_SECRET=${NAME}-line-channel-secret:latest"

      # Not /healthz: Cloud Run's frontend reserves some paths ending in "z" and
      # answers them with its own 404 before the request reaches the app.
      # pricing-data is public and also exercises the database connection.
      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          curl -fsS --retry 3 -o /dev/null "$URL/api/pricing-data"
